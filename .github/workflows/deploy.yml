name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      capture_worker_logs:
        description: Capture production Worker logs for 90 seconds after deployment
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: clown-counter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate:local
      - run: pnpm test:d1
      - run: pnpm db:validate
      - run: pnpm build
  deploy:
    needs: validate
    if: github.repository == 'MHDLabs/clown-counter-bot-CFW' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    environment: production
    concurrency:
      group: clown-counter-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$BOT_TOKEN" || { echo 'Missing BOT_TOKEN'; exit 1; }
      - name: Resolve or create the production D1 database
        shell: bash
        run: |
          find_database_id() {
            pnpm exec wrangler d1 list --json | node -e '
              let json = "";
              process.stdin.setEncoding("utf8");
              process.stdin.on("data", (chunk) => { json += chunk; });
              process.stdin.on("end", () => {
                const database = JSON.parse(json).find((entry) => entry.name === "clown-counter-db");
                if (database) process.stdout.write(database.uuid);
              });
            '
          }

          DB_ID=$(find_database_id)
          if [ -z "$DB_ID" ]; then
            echo "D1 database clown-counter-db does not exist; creating it once."
            if ! pnpm exec wrangler d1 create clown-counter-db; then
              echo "D1 creation failed; checking whether another deployment created it concurrently." >&2
            fi
            DB_ID=$(find_database_id)
          fi
          if [ -z "$DB_ID" ]; then
            echo "Could not find or create D1 database clown-counter-db. Check CLOUDFLARE_API_TOKEN has D1 edit permissions." >&2
            exit 1
          fi

          DB_ID="$DB_ID" node --input-type=module -e '
            import { readFileSync, writeFileSync } from "node:fs";
            const path = "wrangler.jsonc";
            const config = readFileSync(path, "utf8");
            const databaseId = /("database_id"\s*:\s*")[^"]+(")/;
            if (!databaseId.test(config)) throw new Error("Could not locate D1 database_id in wrangler.jsonc");
            writeFileSync(path, config.replace(databaseId, `$1${process.env.DB_ID}$2`));
          '
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply non-destructive production migrations
        run: pnpm db:migrate:prod
      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          pnpm exec wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)
          test -n "$URL" || { echo 'Could not determine deployed workers.dev URL'; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
      - name: Store Telegram token as Worker secret
        shell: bash
        run: printf '%s' "$BOT_TOKEN" | pnpm exec wrangler secret put BOT_TOKEN
      - name: Register Telegram webhook
        run: pnpm set:webhook
      - name: Verify Worker health
        run: curl --fail --silent --show-error "$WORKER_URL/health"
      - name: Capture live Worker logs for diagnosis
        if: github.event_name == 'workflow_dispatch' && inputs.capture_worker_logs
        shell: bash
        run: |
          echo "Starting a 90-second live log capture."
          set +e
          timeout --signal=INT --kill-after=10s 90s pnpm exec wrangler tail clown-counter-bot --format json
          status=$?
          if [ "$status" -eq 124 ] || [ "$status" -eq 130 ]; then
            echo "Live log capture window ended."
            exit 0
          fi
          exit "$status"
