name: Validate and deploy
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: clown-counter-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm db:migrate:local
      - run: pnpm test:d1
      - run: pnpm db:validate
      - run: pnpm build
  deploy:
    needs: validate
    if: github.repository == 'MHDLabs/clown-counter-bot-CFW' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: clown-counter-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Validate required deployment secrets
        shell: bash
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo 'Missing CLOUDFLARE_ACCOUNT_ID'; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'Missing CLOUDFLARE_API_TOKEN'; exit 1; }
          test -n "$BOT_TOKEN" || { echo 'Missing BOT_TOKEN'; exit 1; }
      - name: Resolve existing D1 database without recreating it
        shell: bash
        run: |
          pnpm exec wrangler d1 list --json > /tmp/d1-list.json
          DB_ID=$(node -e 'const x=require("/tmp/d1-list.json"); const d=x.find(v=>v.name==="clown-counter-db"); if(!d) process.exit(2); process.stdout.write(d.uuid)')
          DB_ID="$DB_ID" node -e 'const fs=require("node:fs"); const p="wrangler.jsonc"; const c=JSON.parse(fs.readFileSync(p)); c.account_id=process.env.CLOUDFLARE_ACCOUNT_ID; c.d1_databases[0].database_id=process.env.DB_ID; fs.writeFileSync(p, JSON.stringify(c,null,2)+"\n")'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply non-destructive production migrations
        run: pnpm db:migrate:prod
      - name: Deploy Worker
        id: deploy
        shell: bash
        run: |
          pnpm exec wrangler deploy 2>&1 | tee /tmp/deploy.log
          URL=$(grep -Eo 'https://[^[:space:]]+\.workers\.dev' /tmp/deploy.log | tail -1)
          test -n "$URL" || { echo 'Could not determine deployed workers.dev URL'; exit 1; }
          echo "WORKER_URL=$URL" >> "$GITHUB_ENV"
      - name: Store Telegram token as Worker secret
        shell: bash
        run: printf '%s' "$BOT_TOKEN" | pnpm exec wrangler secret put BOT_TOKEN
      - name: Register Telegram webhook
        run: pnpm set:webhook
      - name: Verify Worker health
        run: curl --fail --silent --show-error "$WORKER_URL/health"
